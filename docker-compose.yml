services:
  web:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      SITE_NAME: "${SITE_NAME:-Zohra Tourism and Hospitality Services}"
      SITE_URL: "${SITE_URL:-http://localhost:8080}"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: "${DB_NAME:-zohra_db}"
      DB_USER: "${DB_USER:-zohra}"
      DB_PASS: "${DB_PASS:?Set DB_PASS in .env}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: "${DB_NAME:-zohra_db}"
      MARIADB_USER: "${DB_USER:-zohra}"
      MARIADB_PASSWORD: "${DB_PASS:?Set DB_PASS in .env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
    volumes:
      - zohra_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  zohra_db_data:
